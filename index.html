<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moniepoint Agent Auth</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="brand-header">Moniepoint Agent</div>
      
      <!-- Login Form -->
      <form id="loginForm">
        <h2>Login</h2>
        <br>
        <div class="form-group">
          <label>Agent ID</label>
          <input type="text" id="loginAgentId" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPassword" required>
        </div>
        <button type="submit" class="btn-primary">Sign In</button>
        <p class="toggle-auth">New Agent? <a href="#" onclick="toggleAuth(true)">Register here</a></p>
      </form>

      <!-- Register Form -->
      <form id="registerForm" style="display: none;">
        <h2>Register</h2>
        <br>
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="regName" required>
        </div>
        <div class="form-group">
          <label>Agent ID</label>
          <input type="text" id="regAgentId" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="regPassword" required>
        </div>
        <button type="submit" class="btn-primary">Register</button>
        <p class="toggle-auth">Already registered? <a href="#" onclick="toggleAuth(false)">Login here</a></p>
      </form>
    </div>
  </div>
  <script src="js/auth.js"></script>
</body>
</html>
