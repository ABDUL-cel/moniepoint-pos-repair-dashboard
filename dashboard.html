<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moniepoint Terminal Technician Portal</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-container">
    
    <!-- Header -->
    <header>
      <div>
        <span class="brand-badge">Moniepoint Technical</span>
        <h2 id="techGreeting">Technician</h2>
        <small id="techIdDisplay">ID: ---</small>
      </div>
      <button class="logout-btn" onclick="logout()">Exit</button>
    </header>

    <!-- Dark KPI Summary Card -->
    <div class="dark-kpi-card">
      <h3>Terminal Operations Performance</h3>
      <div class="kpi-grid">
        <div class="kpi-item">
          <label>Repairs Today</label>
          <div class="value" id="todayRepairCount">0</div>
        </div>
        <div class="kpi-item">
          <label>Repairs This Week</label>
          <div class="value" id="weeklyRepairCount">0</div>
        </div>
      </div>
    </div>

    <!-- Document Repair Card -->
    <div class="card">
      <h3>🛠️ Document Terminal Repair</h3>
      <form id="repairForm">
        <div class="form-group">
          <label>POS Serial Number (S/N)</label>
          <input type="text" id="serialNumber" placeholder="e.g. MP-8210-9940" required>
        </div>
        <div class="form-group">
          <label>Merchant Name / Location</label>
          <input type="text" id="merchantName" placeholder="e.g. Chinedu Stores, Ikeja" required>
        </div>
        <div class="form-group">
          <label>Fault Diagnosed</label>
          <select id="faultType" required>
            <option value="Battery / Charging Port">Battery / Charging Port</option>
            <option value="Screen / Display">Screen / Display</option>
            <option value="Network / SIM Slot">Network / SIM Slot</option>
            <option value="OS / App Software Reflash">OS / App Software Reflash</option>
            <option value="Keypad / Printer Hardware">Keypad / Printer Hardware</option>
          </select>
        </div>
        <div class="form-group">
          <label>Repair Outcome</label>
          <select id="status" required>
            <option value="Fixed">Fixed</option>
            <option value="Replaced Terminal">Replaced Terminal</option>
            <option value="Pending Part">Pending Part</option>
          </select>
        </div>
        <button type="submit" class="btn-primary" id="submitBtn">+ Log Repair Record</button>
      </form>
    </div>

    <!-- Transport Allowance Card -->
    <div class="card">
      <h3>🚙 Field Transport Allowance (₦4,000 / Day)</h3>
      <div class="checkbox-group">
        <div class="checkbox-item"><label>MON</label><input type="checkbox" id="Mon" onchange="updateTransport()"></div>
        <div class="checkbox-item"><label>TUE</label><input type="checkbox" id="Tue" onchange="updateTransport()"></div>
        <div class="checkbox-item"><label>WED</label><input type="checkbox" id="Wed" onchange="updateTransport()"></div>
        <div class="checkbox-item"><label>THU</label><input type="checkbox" id="Thu" onchange="updateTransport()"></div>
        <div class="checkbox-item"><label>FRI</label><input type="checkbox" id="Fri" onchange="updateTransport()"></div>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--border-color);">
        <span style="font-size: 0.85rem; color: var(--text-muted); font-weight: 600;">Total Claimable Allowance</span>
        <span style="font-size: 1.4rem; font-weight: 800; color: var(--primary);" id="transportTotal">₦0</span>
      </div>
    </div>

    <!-- Terminal Log Table Card -->
    <div class="card">
      <h3>📋 Recent Terminal Logs</h3>
      <div style="overflow-x: auto; margin-top: 12px;">
        <table style="width: 100%; text-align: left; border-collapse: collapse; font-size: 0.85rem;">
          <thead>
            <tr style="border-bottom: 2px solid var(--border-color); color: var(--text-muted);">
              <th style="padding: 10px 4px;">S/N</th>
              <th style="padding: 10px 4px;">Merchant</th>
              <th style="padding: 10px 4px;">Fault</th>
              <th style="padding: 10px 4px;">Status</th>
            </tr>
          </thead>
          <tbody id="repairLogsTable">
            <tr>
              <td colspan="4" style="padding: 16px 0; text-align: center; color: var(--text-muted);">No terminal records logged today.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script src="js/dashboard.js"></script>
</body>
</html>
