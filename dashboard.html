<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moniepoint POS Repair Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><rect width='40' height='40' rx='8' fill='%230052FF'/><path d='M11 28V12L20 21L29 12V28H24V19L20 23L16 19V28H11Z' fill='white'/></svg>">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #0357EE;
      --primary-subtle: rgba(3, 87, 238, 0.08);
      --bg-color: #F4F6F9;
      --card-bg: #FFFFFF;
      --text-main: #02102D;
      --text-muted: #64748B;
      --border-color: #E2E8F0;
      --radius: 14px;
      --shadow: 0 4px 18px rgba(0, 0, 0, 0.04);
    }

    [data-theme="dark"] {
      --bg-color: #020B1A;
      --card-bg: #0B1938;
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --border-color: #1E293B;
      --shadow: 0 4px 18px rgba(0, 0, 0, 0.2);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 16px; overflow-x: hidden; }

    header {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
    }

    .kpi-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .kpi-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 16px;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .kpi-title {
      font-size: 0.72rem;
      font-weight: 800;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .kpi-value {
      font-size: 1.4rem;
      font-weight: 800;
      margin-top: 6px;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
    }

    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 0.75rem; font-weight: 700; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; }
    input, select {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid var(--border-color);
      border-radius: 8px;
      background: var(--card-bg);
      color: var(--text-main);
      font-size: 0.9rem;
      font-weight: 600;
      outline: none;
    }
    input:focus, select:focus { border-color: var(--primary); }

    .btn-primary {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 800;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-primary:hover { background: #0044CC; }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
    }
    .badge-fixed { background: rgba(5, 150, 105, 0.12); color: #059669; }
    .badge-replaced { background: rgba(3, 87, 238, 0.12); color: #0357EE; }
    .badge-pending { background: rgba(217, 119, 6, 0.12); color: #D97706; }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div style="display: flex; align-items: center; gap: 12px;">
      <svg width="34" height="34" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="40" height="40" rx="10" fill="#0357EE"/>
        <path d="M11 28V12L20 21L29 12V28H24V19L20 23L16 19V28H11Z" fill="white"/>
      </svg>
      <div>
        <h2 id="techGreeting" style="font-size: 1.05rem; font-weight: 800;">Technician</h2>
        <span id="techIdDisplay" style="font-size: 0.75rem; color: var(--text-muted); font-weight: 600;">ID: ---</span>
      </div>
    </div>

    <div style="display: flex; gap: 10px; align-items: center;">
      <button id="themeToggleBtn" onclick="toggleTheme()" style="background: none; border: 1px solid var(--border-color); padding: 6px 10px; border-radius: 8px; cursor: pointer;">🌙</button>
      <button onclick="logout()" style="background: #EF4444; color: white; border: none; padding: 8px 14px; border-radius: 8px; font-weight: 700; font-size: 0.8rem; cursor: pointer;">Logout</button>
    </div>
  </header>

  <!-- KPI METRICS -->
  <div class="kpi-container">
    <div class="kpi-card">
      <span class="kpi-title">Today's Repairs</span>
      <div id="todayRepairCount" class="kpi-value" style="color: var(--primary);">0 / 15</div>
    </div>
    <div class="kpi-card">
      <span class="kpi-title">Weekly Repairs</span>
      <div id="weeklyRepairCount" class="kpi-value" style="color: #0284C7;">0 / 72</div>
    </div>
    <div class="kpi-card">
      <span class="kpi-title">Monthly Repairs</span>
      <div id="monthlyRepairCount" class="kpi-value" style="color: #059669;">0 / 300</div>
    </div>
    <div class="kpi-card">
      <span class="kpi-title">Year-to-Date</span>
      <div id="yearlyRepairCount" class="kpi-value">0 Total</div>
    </div>
  </div>

  <!-- MAIN GRID -->
  <div class="grid-container">

    <!-- LOG REPAIR FORM -->
    <div class="card">
      <h3 style="margin-bottom: 16px; font-size: 1rem; font-weight: 800; color: var(--primary);">📝 Log Terminal Repair</h3>
      <form id="repairForm">
        <div class="form-group">
          <label for="repairDate">Log Date (Default: Today)</label>
          <input type="date" id="repairDate" required>
        </div>

        <div class="form-group">
          <label for="serialNumber">Terminal Serial Number (S/N)</label>
          <input type="text" id="serialNumber" placeholder="e.g. MP-8830192" required>
        </div>

        <div class="form-group">
          <label for="merchantName">Merchant Name</label>
          <input type="text" id="merchantName" placeholder="e.g. Apex Ventures" required>
        </div>

        <div class="form-group">
          <label for="faultType">Fault Type</label>
          <select id="faultType" required>
            <option value="" disabled selected>Select fault...</option>
            <option value="Battery/Power Defect">Battery / Power Defect</option>
            <option value="Screen/Display Damage">Screen / Display Damage</option>
            <option value="Printer/Paper Jam">Printer / Paper Jam</option>
            <option value="Network/SIM Slot Issue">Network / SIM Slot Issue</option>
            <option value="Keypad/Button Failure">Keypad / Button Failure</option>
            <option value="Software/OS Corruption">Software / OS Corruption</option>
          </select>
        </div>

        <div class="form-group">
          <label for="status">Resolution Status</label>
          <select id="status" required>
            <option value="Repaired & Tested">Repaired & Tested</option>
            <option value="Replaced Terminal">Replaced Terminal</option>
            <option value="Pending Part">Pending Part</option>
          </select>
        </div>

        <button type="submit" id="submitBtn" class="btn-primary">+ Log Repair Record</button>
      </form>
    </div>

    <!-- DAILY TARGET -->
    <div class="card">
      <h3 style="font-size: 1rem; font-weight: 800; margin-bottom: 12px;">🎯 Daily Target (15/Day)</h3>
      <div style="position: relative; width: 120px; height: 120px; margin: 16px auto;">
        <svg viewBox="0 0 36 36" style="width: 100%; height: 100%; transform: rotate(-90deg);">
          <path d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="var(--border-color)" stroke-width="3.5" />
          <path id="dailyCircle" stroke-dasharray="0, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="var(--primary)" stroke-width="3.5" stroke-linecap="round" />
        </svg>
        <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center;">
          <div id="dailyCountText" style="font-size: 1.5rem; font-weight: 800;">0</div>
          <div style="font-size: 0.7rem; color: var(--text-muted); font-weight: 600;">/ 15 Terminals</div>
        </div>
      </div>

      <div style="width: 100%; height: 8px; background: var(--border-color); border-radius: 4px; overflow: hidden; margin-top: 12px;">
        <div id="dailyBar" style="width: 0%; height: 100%; background: var(--primary); transition: width 0.4s ease;"></div>
      </div>
      <div style="display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-muted); margin-top: 6px; font-weight: 600;">
        <span>0</span>
        <span id="dailyBarLabel">0%</span>
        <span>15 Target</span>
      </div>
    </div>

    <!-- RECENT LOGS TABLE -->
    <div class="card" style="grid-column: 1 / -1;">
      <h3 style="font-size: 1rem; font-weight: 800; margin-bottom: 12px;">📋 Documented Repairs</h3>
      <div style="width: 100%; overflow-x: auto;">
        <table style="width: 100%; border-collapse: collapse; min-width: 500px;">
          <thead>
            <tr style="text-align: left; border-bottom: 2px solid var(--border-color);">
              <th style="padding: 8px; font-size: 0.75rem; color: var(--text-muted);">DATE</th>
              <th style="padding: 8px; font-size: 0.75rem; color: var(--text-muted);">SERIAL NUMBER</th>
              <th style="padding: 8px; font-size: 0.75rem; color: var(--text-muted);">MERCHANT</th>
              <th style="padding: 8px; font-size: 0.75rem; color: var(--text-muted);">FAULT</th>
              <th style="padding: 8px; font-size: 0.75rem; color: var(--text-muted);">STATUS</th>
            </tr>
          </thead>
          <tbody id="repairLogsTable">
            <tr>
              <td colspan="5" style="padding: 16px 0; text-align: center; color: var(--text-muted);">Loading logs...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script src="js/dashboard.js"></script>
</body>
</html>
